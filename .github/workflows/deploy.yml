name: deploy-book

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyter-book sphinx numpy matplotlib scipy pandas ipykernel jinja2

    - name: Build the book
      run: |
        # Tenta compilar o livro
        jupyter-book build . || true

    - name: Ensure output directory exists
      run: |
        # Cria a pasta caso o build tenha falhado, evitando erro no tar
        mkdir -p _build/html
        # Se estiver vazia, cria um index.html basico de teste
        if [ ! -f _build/html/index.html ]; then
          echo "<h1>Site MAT034 em Construcao</h1><p>O Jupyter Book ainda nao gerou os arquivos HTML. Verifique os logs do passo 'Build the book'.</p>" > _build/html/index.html
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_build/html'

  deploy:
    needs: deploy-book
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4