name: deploy-book

on:
  push:
    branches:
    - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que deploys concorrentes não atropelem o ambiente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyter-book sphinx numpy matplotlib scipy pandas ipykernel jinja2

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_build/html'

  deploy:
    needs: deploy-book
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4