<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <!-- Fundo escuro arredondado (estilo acadêmico/tech) -->
  <rect width="200" height="200" rx="40" fill="#1e293b" />

  <!-- Eixos X e Y -->
  <path d="M 30 170 L 170 170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M 30 170 L 30 30" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Barras de aproximação numérica (Soma de Riemann) -->
  <rect x="45" y="105" width="25" height="65" fill="#3b82f6" fill-opacity="0.8" rx="2" />
  <rect x="75" y="65" width="25" height="105" fill="#3b82f6" fill-opacity="0.8" rx="2" />
  <rect x="105" y="45" width="25" height="125" fill="#3b82f6" fill-opacity="0.8" rx="2" />
  <rect x="135" y="75" width="25" height="95" fill="#3b82f6" fill-opacity="0.8" rx="2" />

  <!-- Curva analítica suave -->
  <path d="M 30 150 C 60 50, 110 10, 170 110" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Pontos (nós/raízes/interseções) -->
  <circle cx="57.5" cy="105" r="5" fill="#f59e0b" />
  <circle cx="87.5" cy="65" r="5" fill="#f59e0b" />
  <circle cx="117.5" cy="45" r="5" fill="#f59e0b" />
  <circle cx="147.5" cy="75" r="5" fill="#f59e0b" />
</svg>